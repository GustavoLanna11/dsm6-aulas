[project]
name = "auditoria-acessibilidade"
version = "0.1.0"
description = "Suite de testes automatizados de usabilidade e acessibilidade com Playwright"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pytest>=8.3.0",
    "pytest-playwright>=0.5.0",
    axe-playwright-python>=0.1.5"
]

[project.scripts]
auditoria-acessibilidade = "auditoria_acessibilidade:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
